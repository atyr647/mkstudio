name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # "Run workflow" with a release_tag (e.g. v1.0.0-rc.1) builds, tests and - only if everything is green - publishes that
  # release from the commit it was started on (the release step creates the tag).  The same as pushing the tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (must be v + the version in version.tcl); empty = just build and test'
        required: false
        default: ''
      lock_soak:
        description: 'true = also run the lock chaos soak on macOS and Linux (measures how often, if ever, two processes hold the write lock at once)'
        required: false
        default: 'false'

permissions:
  contents: write   # only used to attach starpacks to a tagged release

jobs:

  # ---------------------------------------------------------------- manual: how safe is the write lock, measured
  lock-soak:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lock_soak == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      REAL_MK: '1'
      MKS_CHAOS_KEEP: ${{ github.workspace }}/soak-logs
    steps:
      - uses: actions/checkout@v4
      - name: The macOS kit built by the macos job (cached)
        if: startsWith(matrix.os, 'macos')
        uses: actions/cache/restore@v4
        with:
          path: kitcreator/tclkit-8.6.16
          key: tclkit-${{ matrix.os }}-8.6.16-aqua-v2
          fail-on-cache-miss: true
      - name: Pick the kit
        run: |
          if [ "$RUNNER_OS" = macOS ]; then KIT="$GITHUB_WORKSPACE/kitcreator/tclkit-8.6.16"; else tools/fetch-runtimes.sh linux; KIT="$GITHUB_WORKSPACE/tools/ext/tclkit-8.6.3-linux-x86_64"; fi
          chmod +x "$KIT"; echo "KIT=$KIT" >> "$GITHUB_ENV"
          uname -a; nproc 2>/dev/null || sysctl -n hw.ncpu
      - name: A. shortened limits (1 s), nothing excused - the harshest setting
        run: perl -e 'alarm 900; exec @ARGV' "$KIT" tests/soak_lock_chaos.tcl 10 15 | tee -a soak-A.txt
      - name: B. real limits (5 s / 10 s), processes killed at random - what a user's machine does
        run: MKS_CHAOS_REAL_LIMITS=1 perl -e 'alarm 1200; exec @ARGV' "$KIT" tests/soak_lock_chaos.tcl 15 20 | tee -a soak-B.txt
      - name: C. real limits, and random processes frozen for 1.3 s at a time (starvation on demand)
        run: MKS_CHAOS_REAL_LIMITS=1 MKS_CHAOS_STALL=1 perl -e 'alarm 1200; exec @ARGV' "$KIT" tests/soak_lock_chaos.tcl 15 20 | tee -a soak-C.txt
      - name: Summary
        if: always()
        run: grep -H "SUMMARY\|VIOLATION" soak-*.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.os }}
          path: |
            soak-*.txt
            soak-logs
          if-no-files-found: ignore

  # ---------------------------------------------------------------- current Tcl/Tk runtimes for Linux and Windows
  # The prebuilt tclkits (Tcl/Tk 8.6.3, 2014, zlib 1.2.8) are old.  Current Tcl/Tk 8.6.16 + Metakit kits are built
  # here with KitCreator (tools/build-kit.sh), the way the macOS job builds its own, and cached until the script changes.
  kit-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache the kit
        id: cache
        uses: actions/cache@v4
        with:
          path: kit-out/tclkit-8.6.16-linux-x86_64
          key: kit-linux-${{ hashFiles('tools/build-kit.sh') }}
      # glibc 2.28 (AlmaLinux 8): the kit then runs on RHEL 8+, Debian 10+, Ubuntu 18.10+ and anything newer
      - name: Build Tcl/Tk 8.6.16 + Metakit in a glibc 2.28 container
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 50
        run: |
          mkdir -p kit-out
          docker run --rm -v "$PWD":/src -w /src quay.io/pypa/manylinux_2_28_x86_64 bash -c '
            set -e
            yum install -y tcl autoconf automake libX11-devel libXft-devel fontconfig-devel freetype-devel libXext-devel libXrender-devel libXScrnSaver-devel
            bash tools/build-kit.sh linux /src/kit-out'
          sudo chown -R "$(id -u):$(id -g)" kit-out     # the container wrote as root
          ls -la kit-out
      - name: What the kit needs from the machine it runs on
        run: |
          KIT=kit-out/tclkit-8.6.16-linux-x86_64
          chmod +x "$KIT"
          ls -la "$KIT"
          ldd "$KIT"
          echo "newest glibc symbol:"; objdump -T "$KIT" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          # it must not need more than glibc 2.28 nor a libstdc++ of its own
          newest=$(objdump -T "$KIT" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 | cut -d_ -f2)
          [ "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -1)" = "2.28" ] || { echo "::error::needs glibc $newest"; exit 1; }
          if ldd "$KIT" | grep -q 'libstdc++'; then echo "::error::links libstdc++ dynamically"; exit 1; fi
      - name: Smoke test - Tk opens a window, Metakit and the vfs work
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          KIT=$PWD/kit-out/tclkit-8.6.16-linux-x86_64
          cat > "$RUNNER_TEMP/smoke.tcl" <<'EOS'
          puts "tcl [info patchlevel]"
          package require Tk
          puts "tk [package require Tk] [tk windowingsystem]"
          puts "mk4tcl [package require Mk4tcl]"
          puts "vfs [package require vfs::mk4]"
          label .l -text hello; pack .l; update
          puts "window [winfo width .] x [winfo height .] fonts [llength [font families]]"
          puts "zlib [zlib adler32 hello]"
          exit 0
          EOS
          xvfb-run -a "$KIT" "$RUNNER_TEMP/smoke.tcl"
      - uses: actions/upload-artifact@v4
        with:
          name: kit-linux
          path: kit-out/tclkit-8.6.16-linux-x86_64

  kit-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache the kit
        id: cache
        uses: actions/cache@v4
        with:
          path: kit-out/tclkit-8.6.16-windows-x86_64.exe
          key: kit-windows-${{ hashFiles('tools/build-kit.sh') }}
      - name: Build Tcl/Tk 8.6.16 + Metakit with mingw-w64
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 50
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 tcl8.6 autoconf automake
          # the win32 thread model needs no winpthread DLL
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32
          mkdir -p kit-out
          # cross-compiling: a Tclkit that runs HERE writes the Metakit payload into the Windows kit
          tools/fetch-runtimes.sh linux
          export TCLKIT="$PWD/tools/ext/tclkit-8.6.3-linux-x86_64"
          echo 'exit 0' | "$TCLKIT" && echo "native tclkit works: $TCLKIT"
          bash tools/build-kit.sh windows "$PWD/kit-out"
          ls -la kit-out
      - name: What the kit needs from Windows
        run: |
          KIT=kit-out/tclkit-8.6.16-windows-x86_64.exe
          ls -la "$KIT"; file "$KIT"
          x86_64-w64-mingw32-objdump -p "$KIT" | grep -i 'DLL Name' | sort -u
          # a mingw runtime DLL here would make the program fail on a machine without it
          if x86_64-w64-mingw32-objdump -p "$KIT" | grep -i 'DLL Name' | grep -qiE 'libgcc|libstdc|libwinpthread|zlib1'; then
            echo "::error::the kit depends on a mingw runtime DLL"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kit-windows
          path: kit-out/tclkit-8.6.16-windows-x86_64.exe

  # ---------------------------------------------------------------- Linux: test + build every starpack
  linux:
    needs: [kit-linux, kit-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kit-linux
          path: tools/ext
      - uses: actions/download-artifact@v4
        with:
          name: kit-windows
          path: tools/ext
      - name: Current runtimes are executable
        run: chmod +x tools/ext/tclkit-8.6.16-*

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 xvfb imagemagick strace

      - name: Fetch tclkit runtimes (SHA1-verified)
        run: tools/fetch-runtimes.sh

      - name: Lint
        run: tclsh8.6 tests/lint.tcl
      - name: Engine tests (stand-in Metakit)
        run: tclsh8.6 tests/test_mkql.tcl
      # Every suite runs on BOTH Tcl runtimes (current 8.6.16 and 8.5.17) against real Metakit; the ones that can also
      # run on the pure-Tcl stand-in do that too.
      - name: Engine, contract, persistence, semantics, provider lifecycle and contract (real Metakit, Tcl 8.6 and 8.5)
        run: |
          for kit in tools/ext/tclkit-8.6.16-linux-x86_64 tools/ext/tclkit-8.5.17-linux-x86_64; do
            echo "=== $kit"
            for t in test_mkql engine_contract persist test_engine_semantics test_provider_lifecycle test_provider_contract; do
              echo "--- $t"; REAL_MK=1 $kit tests/$t.tcl
            done
          done
      - name: Stand-in Metakit (pure Tcl)
        run: |
          for t in test_mkql test_engine_semantics test_provider_lifecycle test_provider_contract; do tclsh8.6 tests/$t.tcl; done
      - name: Optimised executor == reference executor (random queries; stand-in, Metakit 8.6, Metakit 8.5)
        run: |
          MKS_FUZZ=1000 tclsh8.6 tests/test_engine_diff.tcl
          MKS_FUZZ=1500 REAL_MK=1 tools/ext/tclkit-8.6.16-linux-x86_64 tests/test_engine_diff.tcl
          MKS_FUZZ=800 MKS_SEED=5 REAL_MK=1 tools/ext/tclkit-8.5.17-linux-x86_64 tests/test_engine_diff.tcl

      - name: Crash-safe editing (real Metakit, kills a committing process; Tcl 8.6 and 8.5)
        run: |
          MKS_CRASH_TRIALS=15 tools/ext/tclkit-8.6.16-linux-x86_64 tests/run.tcl tests/test_crash_safety.tcl
          MKS_CRASH_TRIALS=8 tools/ext/tclkit-8.5.17-linux-x86_64 tests/run.tcl tests/test_crash_safety.tcl

      - name: Power loss, best effort (synthesised after-power-cut files; real kills at every point of a real commit)
        run: |
          REAL_MK=1 tools/ext/tclkit-8.6.16-linux-x86_64 tests/run.tcl tests/test_power_loss.tcl
          MKS_POWER_SCENARIOS=edit_one_cell,add_column,two_views REAL_MK=1 tools/ext/tclkit-8.5.17-linux-x86_64 tests/run.tcl tests/test_power_loss.tcl

      - name: Power safety (first commit, checksum, backup), crash reports, update path (Tcl 8.6 and 8.5)
        run: |
          for kit in tools/ext/tclkit-8.6.16-linux-x86_64 tools/ext/tclkit-8.5.17-linux-x86_64; do
            for t in test_durability test_crash test_update; do REAL_MK=1 $kit tests/run.tcl tests/$t.tcl; done
          done

      - name: Write-lock protocol, crash points and chaos (Tcl 8.6 and 8.5)
        run: |
          for kit in tools/ext/tclkit-8.6.16-linux-x86_64 tools/ext/tclkit-8.5.17-linux-x86_64; do
            REAL_MK=1 $kit tests/run.tcl tests/test_lock_protocol.tcl
            REAL_MK=1 $kit tests/run.tcl tests/test_lock_crash.tcl
          done

      - name: Grid virtualisation (real Metakit, Tcl 8.6 and 8.5)
        run: |
          REAL_MK=1 xvfb-run -a tools/ext/tclkit-8.6.16-linux-x86_64 tests/test_grid.tcl
          REAL_MK=1 xvfb-run -a tools/ext/tclkit-8.5.17-linux-x86_64 tests/test_grid.tcl

      - name: UI logic (real Metakit, Tcl 8.6)
        run: REAL_MK=1 xvfb-run -a tools/ext/tclkit-8.6.16-linux-x86_64 tests/gui_logic.tcl
      - name: UI logic (real Metakit, Tcl 8.5)
        run: REAL_MK=1 xvfb-run -a tools/ext/tclkit-8.5.17-linux-x86_64 tests/gui_logic.tcl

      - name: Build starpacks (Linux, Windows) on the current runtimes
        run: MKS_REQUIRE_CURRENT=1 ./build.sh all
      - name: Verify embedded payloads
        run: tools/ext/tclkit-8.6.16-linux-x86_64 tests/verify_payload.tcl dist/*
      - name: Launch the Linux starpack
        run: tests/smoke_starpack.sh
      - name: Real self-update - the real starpack replaces a running program (Tcl 8.6 and 8.5)
        run: |
          for kit in tools/ext/tclkit-8.6.16-linux-x86_64 tools/ext/tclkit-8.5.17-linux-x86_64; do
            MKS_TEST_STARPACK="$PWD/dist/mkstudio-linux-x86_64" REAL_MK=1 $kit tests/run.tcl tests/test_update.tcl
          done
      - name: --version and --selftest of the Linux starpack
        run: |
          v=$(grep -o 'current [0-9][^ ]*' mkstudio.vfs/lib/app-mkstudio/version.tcl | cut -d' ' -f2)
          test "$(dist/mkstudio-linux-x86_64 --version)" = "$v"
          dist/mkstudio-linux-x86_64 --selftest "$RUNNER_TEMP/st.txt"
          cat "$RUNNER_TEMP/st.txt"; grep -q "^ok $v mk4tcl yes" "$RUNNER_TEMP/st.txt"

      - name: Live update check - the real GitHub release feed, real download, real checksum, real starpack
        env:
          MKS_UPDATE_TOKEN: ${{ github.token }}
        run: |
          for try in 1 2 3; do
            REAL_MK=1 tools/ext/tclkit-8.6.16-linux-x86_64 tests/run.tcl tests/test_update_live.tcl && break
            [ $try = 3 ] && exit 1; echo "(attempt $try failed; the network may be busy - trying again)"; sleep 20
          done

      - uses: actions/upload-artifact@v4
        with:
          name: starpacks
          path: dist/*

  # ---------------------------------------------------------------- Windows: run it for real
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      REAL_MK: '1'
      KIT: tools/ext/tclkit-8.6.16-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: starpacks
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: kit-windows
          path: tools/ext

      # The Windows tclkit has no console, so each test also writes its output to MKS_TEST_LOG.
      - name: Engine, contract, persistence and UI tests on Windows (real Metakit)
        timeout-minutes: 25
        run: |
          fail=0
          for t in test_mkql engine_contract persist test_engine_semantics test_provider_lifecycle test_provider_contract test_engine_diff test_crash_safety test_power_loss test_durability test_crash test_update test_lock_protocol test_lock_crash test_grid gui_logic; do
            log="$RUNNER_TEMP/$t.log"; rm -f "$log"
            # forcing data to disk starts PowerShell twice per commit: only the durability test does it for real
            D=0; [ "$t" = test_durability ] && D=1
            MKS_TEST_STARPACK="$(cygpath -w "$PWD/dist/mkstudio-windows-x86_64.exe")" MKS_TEST_TIMEOUT=480 MKS_DURABLE=$D MKS_EXPECT_FLUSH=1 MKS_FUZZ=400 MKS_CRASH_TRIALS=8 MKS_RACE_ROUNDS=3 MKS_CHAOS_SECONDS=4 MKS_POWER_SCENARIOS=edit_one_cell,add_column,two_views MKS_TEST_LOG="$(cygpath -w "$log")" timeout 540 "$KIT" tests/run.tcl "tests/$t.tcl" || echo "(exit code $?)"
            if ! tail -1 "$log" 2>/dev/null | grep -q ' 0 failed'; then fail=1; fi
          done
          exit $fail

      - name: Show test logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/*.log; do echo "=== $f"; cat "$f"; done

      - name: --version and --selftest of the Windows starpack
        timeout-minutes: 3
        run: |
          v=$(grep -o 'current [0-9][^ ]*' mkstudio.vfs/lib/app-mkstudio/version.tcl | cut -d' ' -f2)
          rm -f "$RUNNER_TEMP/st.txt"
          ./dist/mkstudio-windows-x86_64.exe --selftest "$(cygpath -w "$RUNNER_TEMP/st.txt")"
          for i in $(seq 1 30); do [ -s "$RUNNER_TEMP/st.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/st.txt"; grep -q "^ok $v mk4tcl yes" "$RUNNER_TEMP/st.txt"

      - name: Live update check - the real GitHub release feed, real download, real checksum, real starpack
        timeout-minutes: 12
        env:
          MKS_UPDATE_TOKEN: ${{ github.token }}
        run: |
          log="$RUNNER_TEMP/live.log"
          for try in 1 2 3; do
            rm -f "$log"
            MKS_TEST_TIMEOUT=300 MKS_TEST_LOG="$(cygpath -w "$log")" timeout 360 "$KIT" tests/run.tcl tests/test_update_live.tcl || true
            tail -1 "$log" 2>/dev/null | grep -q ' 0 failed' && break
            echo "(attempt $try failed)"; cat "$log" 2>/dev/null; sleep 20
          done
          cat "$log"
          tail -1 "$log" | grep -q ' 0 failed'

      - name: Launch the Windows starpack
        timeout-minutes: 5
        run: |
          DB="$RUNNER_TEMP/smoke.mk"
          "$KIT" tests/make_sample.tcl "$(cygpath -w "$DB")"
          ./dist/mkstudio-windows-x86_64.exe "$(cygpath -w "$DB")" &
          PID=$!
          sleep 12
          if ! kill -0 $PID 2>/dev/null; then echo "starpack exited early"; exit 1; fi
          powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.SystemInformation]::VirtualScreen; \$bmp=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \$g=[System.Drawing.Graphics]::FromImage(\$bmp); \$g.CopyFromScreen(\$b.Left,\$b.Top,0,0,\$bmp.Size); \$bmp.Save('windows-starpack.png')"
          kill $PID || true
          echo "Windows starpack ran 12s and kept running"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: windows-starpack.png
          if-no-files-found: ignore

  # ---------------------------------------------------------------- macOS: run it for real
  macos:
    needs: linux
    # macos-15-intel is x86_64; macos-latest is Apple silicon (arm64).  The prebuilt Mac
    # tclkits (Tk 8.6.3 and 8.5.17, 2014) crash on current macOS, so a current Tcl/Tk 8.6
    # kit with Metakit storage is built natively on each machine with KitCreator.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      REAL_MK: '1'
      TCL_VERSION: 8.6.16
    steps:
      - uses: actions/checkout@v4

      - name: Cache the tclkit
        id: cache
        uses: actions/cache@v4
        with:
          path: kitcreator/tclkit-${{ env.TCL_VERSION }}
          key: tclkit-${{ matrix.os }}-${{ env.TCL_VERSION }}-aqua-v2

      - name: Build a current tclkit (Tcl/Tk + Metakit) with KitCreator
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: |
          brew install autoconf automake || true
          curl -fsSL "https://kitcreator.rkeene.org/fossil/tarball/kitcreator.tar.gz?uuid=trunk" -o kc.tgz
          tar xzf kc.tgz
          cd kitcreator

          # (1) KitCreator pins zlib 1.2.8 (2013), which does not compile against the current
          #     macOS SDK (zutil.h redefines fdopen).  Use 1.3.1 from the zlib project's GitHub
          #     release; the checksum is computed here and printed so it can be pinned.
          ZV=1.3.1
          curl -fsSL -o zlib.tgz "https://github.com/madler/zlib/releases/download/v${ZV}/zlib-${ZV}.tar.gz"
          SHA=$(shasum -a 256 zlib.tgz | cut -d' ' -f1)
          echo "zlib ${ZV} sha256 ${SHA}"
          sed -i '' -e "s|^version=.*|version=\"${ZV}\"|" \
                    -e "s|^url=.*|url=\"https://github.com/madler/zlib/releases/download/v\${version}/zlib-\${version}.tar.gz\"|" \
                    -e "s|^sha256=.*|sha256='${SHA}'|" zlib/build.sh
          head -8 zlib/build.sh

          # (2) a repository checkout (not a release tarball) needs kitsh's generated files
          bash build/pre.sh

          # Metakit is old C++ and kitsh uses K&R-style C parameter lists.  autoconf 2.72
          # adds -std=gnu23 (where those are errors), and the later -std wins, so pin C99.
          export CXXFLAGS="-std=c++11 -Wno-register -Wno-deprecated -w"
          export CFLAGS="-w -std=gnu99"
          # Tk builds the X11 flavour unless told otherwise (no X11 headers on Apple silicon runners,
          # and an X server would be needed to run it anyway): ask for the native Aqua Tk.
          if ! ./kitcreator ${TCL_VERSION} --enable-aqua=yes; then
            echo "::error::KitCreator failed"
            # Tk tries macosx, unix, win, ... in turn, so the LAST error is a Windows one; show the FIRST
            echo "::group::tk/build.log - first errors"
            grep -n -m6 -i -B3 -A6 'error\|No such file\|not found' tk/build.log | head -90 || true
            echo "::endgroup::"
            for p in zlib kitsh; do
              [ -f "$p/build.log" ] && { echo "::group::$p/build.log (last 40 lines)"; tail -40 "$p/build.log"; echo "::endgroup::"; }
            done
            exit 1
          fi
          ls -la tclkit-${TCL_VERSION}

      - name: Use the built tclkit
        run: |
          KIT="$GITHUB_WORKSPACE/kitcreator/tclkit-${TCL_VERSION}"
          chmod +x "$KIT"
          echo "KIT=$KIT" >> "$GITHUB_ENV"
          file "$KIT"

      - name: Engine, contract, persistence and UI tests on macOS (real Metakit, current Tk)
        timeout-minutes: 15
        run: |
          fail=0
          for t in test_mkql engine_contract persist test_engine_semantics test_provider_lifecycle test_provider_contract test_engine_diff test_crash_safety test_power_loss test_durability test_crash test_update test_lock_protocol test_lock_crash test_grid gui_logic; do
            log="$RUNNER_TEMP/$t.log"; rm -f "$log"
            MKS_FUZZ=400 MKS_CRASH_TRIALS=8 MKS_RACE_ROUNDS=3 MKS_CHAOS_SECONDS=4 MKS_POWER_SCENARIOS=edit_one_cell,add_column,two_views MKS_TEST_LOG="$log" perl -e 'alarm 300; exec @ARGV' "$KIT" tests/run.tcl "tests/$t.tcl" || echo "(exit code $?)"
            if ! tail -1 "$log" 2>/dev/null | grep -q ' 0 failed'; then fail=1; fi
          done
          exit $fail

      - name: Show test logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/*.log; do echo "=== $f"; cat "$f"; done

      - name: Wrap the macOS starpack on this machine with the tested runtime
        run: |
          cp "$KIT" "$RUNNER_TEMP/runtime" && chmod +x "$RUNNER_TEMP/runtime"
          mkdir -p dist
          OUT=dist/mkstudio-macos-$(uname -m)
          "$KIT" tools/wrap.tcl "$RUNNER_TEMP/runtime" mkstudio.vfs "$OUT"
          chmod +x "$OUT"
          "$KIT" tests/verify_payload.tcl "$OUT"
          # an appended payload invalidates the signature; Apple silicon refuses unsigned code
          codesign --force --sign - "$OUT" || echo "(codesign cannot re-sign a starpack - its payload follows the Mach-O image; the tclkit keeps its own ad-hoc signature)"
          codesign -dv "$OUT" 2>&1 | head -6 || true
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: --version and --selftest of the macOS starpack
        run: |
          v=$(grep -o 'current [0-9][^ ]*' mkstudio.vfs/lib/app-mkstudio/version.tcl | cut -d' ' -f2)
          test "$("./$OUT" --version)" = "$v"
          "./$OUT" --selftest "$RUNNER_TEMP/st.txt"; cat "$RUNNER_TEMP/st.txt"; grep -q "^ok $v mk4tcl yes" "$RUNNER_TEMP/st.txt"

      - name: Real self-update - the real starpack replaces a running program
        run: MKS_TEST_STARPACK="$PWD/$OUT" "$KIT" tests/run.tcl tests/test_update.tcl

      - name: Live update check - the real GitHub release feed, real download, real checksum, real starpack
        timeout-minutes: 12
        env:
          MKS_UPDATE_TOKEN: ${{ github.token }}
        run: |
          for try in 1 2 3; do
            perl -e 'alarm 360; exec @ARGV' "$KIT" tests/run.tcl tests/test_update_live.tcl && break
            [ $try = 3 ] && exit 1; echo "(attempt $try failed)"; sleep 20
          done

      - name: Build and test the .app and .dmg
        timeout-minutes: 10
        run: |
          v=$(grep -o 'current [0-9][^ ]*' mkstudio.vfs/lib/app-mkstudio/version.tcl | cut -d' ' -f2)
          packaging/macos/make-dmg.sh "$v" "$OUT" dist
          DMG=$(ls dist/MKStudio-*.dmg)
          MNT="$RUNNER_TEMP/dmg"; mkdir -p "$MNT"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          ls -la "$MNT"
          # (no signature verification: codesign refuses a file with a payload after its Mach-O image; what follows runs it)
          codesign -dv "$MNT/MK Studio.app/Contents/MacOS/mkstudio" 2>&1 | head -6 || true
          "$MNT/MK Studio.app/Contents/MacOS/mkstudio" --selftest "$RUNNER_TEMP/st2.txt"
          cat "$RUNNER_TEMP/st2.txt"; grep -q "^ok $v mk4tcl yes" "$RUNNER_TEMP/st2.txt"
          # the app must also start as an app (a window appears and it keeps running)
          cp -R "$MNT/MK Studio.app" "$RUNNER_TEMP/MK Studio.app"
          hdiutil detach "$MNT" -quiet
          open -n "$RUNNER_TEMP/MK Studio.app" --args || true
          sleep 10
          pgrep -f "MK Studio.app/Contents/MacOS/mkstudio" >/dev/null || { echo "the app exited early"; exit 1; }
          pkill -f "MK Studio.app/Contents/MacOS/mkstudio" || true

      - name: Launch the macOS starpack
        timeout-minutes: 5
        run: |
          DB="$RUNNER_TEMP/smoke.mk"
          "$KIT" tests/make_sample.tcl "$DB"
          "./$OUT" "$DB" &
          PID=$!
          sleep 12
          if ! kill -0 $PID 2>/dev/null; then echo "starpack exited early"; exit 1; fi
          screencapture -x macos-starpack.png || true
          kill $PID || true
          echo "macOS starpack ran 12s and kept running"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.os }}
          path: |
            macos-starpack.png
            dist/mkstudio-macos-*
            dist/MKStudio-*.dmg
          if-no-files-found: ignore

  # ---------------------------------------------------------------- mkit-sql: does the other repo still fit?
  # mkit-sql lives in its own repository and follows the same lock protocol, goes behind MK Studio's query
  # window and will use the streaming-provider contract.  These checks run its own contract/integration tests
  # against THIS checkout, race its lock implementation against ours, and compare bulk-mutation speed.  They
  # report but do not block a release (the other repository can change on its own).
  interop:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atyr647/mkit-sql
          path: mkit-sql
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fetch tclkit runtimes
        run: tools/fetch-runtimes.sh
      - name: Lock protocol - mixed races and crash points with mkit-sql's implementation
        run: MKITSQL_DIR="$PWD/mkit-sql" REAL_MK=1 MKS_RACE_ROUNDS=3 tools/ext/tclkit-8.6.3-linux-x86_64 tests/run.tcl tests/test_lock_protocol.tcl
      - name: mkit-sql's own lock tests, interoperating with this store.tcl
        working-directory: mkit-sql
        run: MKSTUDIO_DIR="$GITHUB_WORKSPACE" MKIT_MK4TCL=builtin "$GITHUB_WORKSPACE/tools/ext/tclkit-8.6.3-linux-x86_64" tests/locking.tcl
      - name: mkit-sql's MK Studio contract and integration tests, against this checkout
        working-directory: mkit-sql
        run: |
          KIT="$GITHUB_WORKSPACE/tools/ext/tclkit-8.6.3-linux-x86_64"
          MKSTUDIO_DIR="$GITHUB_WORKSPACE" MKIT_MK4TCL=builtin "$KIT" tests/studio_contract.tcl
          MKSTUDIO_DIR="$GITHUB_WORKSPACE" MKIT_MK4TCL=builtin xvfb-run -a "$KIT" tests/studio_integration.tcl
      - name: Bulk mutation, MK Studio vs mkit-sql (identical workloads, results must be identical)
        run: MKITSQL_DIR="$PWD/mkit-sql" REAL_MK=1 tools/ext/tclkit-8.6.3-linux-x86_64 tests/bench_mutation.tcl 100000

  # ---------------------------------------------------------------- installers that can be built anywhere
  package:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: starpacks
          path: dist
      - name: Install makensis
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: .deb, .tar.gz and the Windows installer
        run: |
          v=$(grep -o 'current [0-9][^ ]*' mkstudio.vfs/lib/app-mkstudio/version.tcl | cut -d' ' -f2)
          base=${v%%-*}
          chmod +x dist/mkstudio-linux-x86_64
          mkdir -p packages
          packaging/linux/make-packages.sh "$v" dist/mkstudio-linux-x86_64 packages
          makensis -V2 -DVERSION="$v" -DVIVERSION="$base.0" -DEXE="$PWD/dist/mkstudio-windows-x86_64.exe" \
            -DICON="$PWD/packaging/icons/mkstudio.ico" -DLICENSE="$PWD/LICENSE" -DNOTICES="$PWD/THIRD_PARTY_NOTICES" -DOUTFILE="$PWD/packages/MKStudio-$v-windows-x64-setup.exe" packaging/windows/installer.nsi
          ls -l packages
      - name: Install the .deb, run it, remove it
        run: |
          sudo dpkg -i packages/mkstudio_*_amd64.deb
          v=$(grep -o 'current [0-9][^ ]*' mkstudio.vfs/lib/app-mkstudio/version.tcl | cut -d' ' -f2)
          mkstudio --selftest "$RUNNER_TEMP/st.txt"; cat "$RUNNER_TEMP/st.txt"; grep -q "^ok $v mk4tcl yes" "$RUNNER_TEMP/st.txt"
          test -f /usr/share/applications/mkstudio.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/mkstudio.png
          sudo dpkg -r mkstudio
          test ! -e /usr/bin/mkstudio
      - name: Package contents include the license
        run: |
          dpkg-deb -c packages/mkstudio_*_amd64.deb | grep -q usr/share/doc/mkstudio/copyright
          tar tzf packages/MKStudio-*-linux-x86_64.tar.gz | grep -q LICENSE
      - name: The tarball installs for one user
        run: |
          export HOME=$(mktemp -d)
          tar xzf packages/MKStudio-*-linux-x86_64.tar.gz -C "$HOME"
          sh "$HOME"/MKStudio-*-linux-x86_64/install.sh
          "$HOME/.local/bin/mkstudio" --selftest "$HOME/st.txt"; cat "$HOME/st.txt"
          grep -q "^Exec=$HOME/.local/bin/mkstudio" "$HOME/.local/share/applications/mkstudio.desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*

  windows-installer:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Install silently, check, run, uninstall
        run: |
          # Git-bash rewrites an argument like /S into a Windows path (C:/Program Files/Git/S): the installer then never saw
          # its silent switch, opened its wizard and waited for a click - the "hang" of the first two runs.
          export MSYS2_ARG_CONV_EXCL='*'
          v=$(grep -o 'current [0-9][^ ]*' mkstudio.vfs/lib/app-mkstudio/version.tcl | cut -d' ' -f2)
          SETUP=$(ls packages/MKStudio-*-windows-x64-setup.exe)
          INST=$(cygpath -u "$LOCALAPPDATA")/Programs/"MK Studio"
          # (every call has a time limit: a silent installer that never returns once cost a 15-minute job)
          timeout 120 "$SETUP" /S || echo "installer exit code $?"
          for i in $(seq 1 60); do [ -f "$INST/mkstudio.exe" ] && [ -f "$INST/Uninstall.exe" ] && break; sleep 1; done
          ls -la "$INST"
          test -f "$INST/mkstudio.exe"
          test -f "$INST/LICENSE.txt"
          test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/MK Studio/MK Studio.lnk"
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\MKStudio' /v DisplayVersion | grep -q "$v"
          reg query 'HKCU\Software\Classes\MKStudio.Database\shell\open\command'
          rm -f "$RUNNER_TEMP/st.txt"
          "$INST/mkstudio.exe" --selftest "$(cygpath -w "$RUNNER_TEMP/st.txt")"
          for i in $(seq 1 30); do [ -s "$RUNNER_TEMP/st.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/st.txt"; grep -q "^ok $v mk4tcl yes" "$RUNNER_TEMP/st.txt"
          # installing again over a copy that exists is an upgrade
          timeout 120 "$SETUP" /S || echo "installer exit code $?"
          for i in $(seq 1 30); do sleep 1; [ -f "$INST/mkstudio.exe" ] && break; done
          test -f "$INST/mkstudio.exe"
          # uninstall (the uninstaller copies itself away and returns at once: wait for the files to go)
          timeout 120 "$INST/Uninstall.exe" /S || echo "uninstaller exit code $?"
          for i in $(seq 1 60); do [ ! -f "$INST/mkstudio.exe" ] && break; sleep 1; done
          test ! -f "$INST/mkstudio.exe"
          test ! -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/MK Studio/MK Studio.lnk"
          ! reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\MKStudio' 2>/dev/null
          echo "installer: install, upgrade, run, uninstall all fine"

  release:
    needs: [linux, windows, macos, package, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag must be the version in the source
        run: |
          v=$(grep -o 'current [0-9][^ ]*' mkstudio.vfs/lib/app-mkstudio/version.tcl | cut -d' ' -f2)
          test "$TAG" = "v$v" || { echo "::error::tag $TAG does not match the version $v in version.tcl"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: starpacks
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Checksums and notes
        run: |
          cd dist
          # The macOS jobs uploaded their files with the folder name (dist/...), so after the download they sit one level down: the
          # first release (v1.0.0-rc.1) went out WITHOUT the macOS files because of that.  Bring them up, and refuse to publish
          # anything that lacks a platform.
          find . -mindepth 2 -type f \( -name 'mkstudio-macos-*' -o -name 'MKStudio-*.dmg' \) -exec mv {} . \;
          # GitHub rewrites '~' in an asset name to '.': give the file that name here, so SHA256SUMS matches what is downloaded
          for f in *~*; do [ -e "$f" ] && mv "$f" "$(echo "$f" | tr '~' '.')"; done
          rm -f mkstudio-linux-x86_64.exe *.png
          for f in mkstudio-linux-x86_64 mkstudio-windows-x86_64.exe mkstudio-macos-arm64 mkstudio-macos-x86_64; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          ls MKStudio-*-macos-arm64.dmg MKStudio-*-macos-x86_64.dmg MKStudio-*-windows-x64-setup.exe MKStudio-*-linux-x86_64.tar.gz mkstudio_*_amd64.deb
          # only release files; the in-app updater downloads SHA256SUMS next to the file it replaces
          ls -lR
          sha256sum mkstudio-* MKStudio-* mkstudio_* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          sed "s/<version>/$VERSION/g" RELEASE_NOTES.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mkstudio-*
            dist/MKStudio-*
            dist/mkstudio_*
            dist/SHA256SUMS
          body_path: notes.md
          name: MK Studio ${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(env.TAG, '-') }}
