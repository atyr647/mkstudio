name: diag
# Throwaway diagnostics for the Windows runtime (not part of the product).  Runs only when started by hand or when
# the diagnostic itself changes.
on:
  workflow_dispatch:
  push:
    branches: ['ccr-f017368d-kguqg8']
    paths: ['tests/diag_win_ps.tcl', '.github/workflows/diag.yml']
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4          # (a cache can only be restored on the OS that saved it)
        with:
          path: kit-out/tclkit-8.6.16-windows-x86_64.exe
          key: kit-windows-${{ hashFiles('tools/build-kit.sh') }}
          fail-on-cache-miss: true
      - uses: actions/upload-artifact@v4
        with:
          name: diag-kit
          path: kit-out/tclkit-8.6.16-windows-x86_64.exe
  windows-ps:
    needs: kit
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diag-kit
          path: kit-out
      - name: The old prebuilt Windows kit
        run: tools/fetch-runtimes.sh
      - name: PowerShell from the NEW kit
        run: |
          log="$RUNNER_TEMP/new.log"; rm -f "$log"
          MKS_TEST_LOG="$(cygpath -w "$log")" timeout 300 kit-out/tclkit-8.6.16-windows-x86_64.exe tests/run.tcl tests/diag_win_ps.tcl || true
          cat "$log"
      - name: PowerShell from the OLD kit
        run: |
          log="$RUNNER_TEMP/old.log"; rm -f "$log"
          MKS_TEST_LOG="$(cygpath -w "$log")" timeout 300 tools/ext/tclkit-8.6.3-win32-x86_64.exe tests/run.tcl tests/diag_win_ps.tcl || true
          cat "$log"
