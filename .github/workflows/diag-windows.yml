name: diag-windows
# TEMPORARY: where does the 64-bit Metakit hang on Windows?  Takes the kit from a build run (no rebuild).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build run whose kit-windows artifact to use'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kit-windows
          path: kit
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Experiments (each in its own process with a 40 s limit)
        run: |
          KIT="$PWD/kit/tclkit-8.6.18-windows-x86_64.exe"
          for e in raw3 raw20 raw20b rawbig raw2000 storenob store storeguard; do
            log="$RUNNER_TEMP/diag_$e.log"; rm -f "$log"
            timeout 40 "$KIT" "$(cygpath -w "$PWD/tools/diag/wide_commit.tcl")" "$e" "$(cygpath -w "$log")"; rc=$?
            echo "=== $e: exit $rc"; cat "$log" 2>/dev/null | sed 's/^/    /'
          done
      - name: The real test_wide with a trace of every store command
        run: |
          KIT="$PWD/kit/tclkit-8.6.18-windows-x86_64.exe"
          rm -f "$RUNNER_TEMP/tw.log" "$RUNNER_TEMP/tw.trace"
          MKS_TRACE="$(cygpath -w "$RUNNER_TEMP/tw.trace")" MKS_TEST_LOG="$(cygpath -w "$RUNNER_TEMP/tw.log")" EXPECT_WIDE=1 timeout 90 "$KIT" "$(cygpath -w "$PWD/tests/run.tcl")" "$(cygpath -w "$PWD/tests/test_wide.tcl")"; rc=$?
          echo "=== test_wide: exit $rc"; tail -12 "$RUNNER_TEMP/tw.log" | sed 's/^/    log: /'; echo "--- last store commands:"; tail -25 "$RUNNER_TEMP/tw.trace" | sed 's/^/    /'
